# Pixel City Gandhinagar on Cloudflare: viewer (static assets) + tiles (R2) + presence/game (Durable Object).
# Full steps: deploy/cloudflare/README.md. Deploy: npm run deploy
name = "pixel-city-gandhinagar"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[assets]
directory = "../../apps/viewer/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/maps/*", "/map/*"]

[[r2_buckets]]
binding = "TILES"
bucket_name = "pixel-city-tiles"

[[durable_objects.bindings]]
name = "CITY_ROOM"
class_name = "CityRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CityRoom"]

# Optional mirror of the visit total. Create with: npx wrangler kv namespace create VISITS
# [[kv_namespaces]]
# binding = "VISITS"
# id = "<namespace id>"
